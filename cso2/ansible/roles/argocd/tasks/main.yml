---
# ArgoCD installation tasks using kubectl commands
# This avoids dependency on kubernetes.core python packages

- name: Create ArgoCD namespace
  ansible.builtin.shell: |
    kubectl create namespace {{ argocd_namespace }} --dry-run=client -o yaml | kubectl apply -f -
  become: no
  changed_when: true

- name: Download ArgoCD manifest
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/argoproj/argo-cd/{{ argocd_version }}/manifests/install.yaml"
    dest: /tmp/argocd-install.yaml
    mode: '0644'

- name: Install ArgoCD
  ansible.builtin.shell: |
    kubectl apply -n {{ argocd_namespace }} -f /tmp/argocd-install.yaml
  become: no
  changed_when: true

- name: Wait for ArgoCD server deployment to be ready
  ansible.builtin.shell: |
    kubectl -n {{ argocd_namespace }} rollout status deployment/argocd-server --timeout=300s
  become: no
  register: argocd_rollout
  retries: 3
  delay: 30
  until: argocd_rollout.rc == 0

- name: Get ArgoCD initial admin password
  ansible.builtin.shell: |
    kubectl -n {{ argocd_namespace }} get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d
  register: argocd_password
  changed_when: false
  become: no
  retries: 5
  delay: 10
  until: argocd_password.rc == 0

- name: Display ArgoCD admin password
  ansible.builtin.debug:
    msg: "ArgoCD admin password: {{ argocd_password.stdout }}"

---
# OpenSearch Inventory File
# Configure your OpenSearch cluster nodes here
#
# For a 3-node cluster, define 3 hosts
# For single-node setup, define just 1 host

all:
  children:
    opensearch:
      hosts:
        opensearch-node-1:
          ansible_host: 10.0.1.10  # Replace with actual IP
          opensearch_node_name: opensearch-node-1
          opensearch_node_roles: ["master", "data", "ingest"]
        
        opensearch-node-2:
          ansible_host: 10.0.1.11  # Replace with actual IP
          opensearch_node_name: opensearch-node-2
          opensearch_node_roles: ["master", "data", "ingest"]
        
        opensearch-node-3:
          ansible_host: 10.0.1.12  # Replace with actual IP
          opensearch_node_name: opensearch-node-3
          opensearch_node_roles: ["master", "data", "ingest"]
      
      vars:
        ansible_user: ubuntu
        ansible_ssh_private_key_file: ~/.ssh/id_rsa
        ansible_python_interpreter: /usr/bin/python3


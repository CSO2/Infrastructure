---
- hosts: all
  become: yes
  roles:
    - common

- hosts: role_control_plane
  become: yes
  roles:
    - control_plane

- hosts: role_worker
  become: yes
  roles:
    - worker

# OpenSearch Cluster Deployment
# Run separately with: ansible-playbook -i inventory/opensearch_hosts.yml opensearch.yml
- hosts: opensearch
  become: yes
  roles:
    - opensearch
  tags:
    - opensearch
    - logging

[SERVICE]
    Flush         1
    Log_Level     info
    Daemon        off
    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

# Collect Docker container logs
[INPUT]
    Name          forward
    Listen        0.0.0.0
    Port          24224
    Tag           docker.*

# Add timestamp if missing
[FILTER]
    Name          record_modifier
    Match         *
    Record        hostname ${HOSTNAME}

# Parse JSON logs
[FILTER]
    Name          parser
    Match         *
    Key_Name      log
    Parser        json
    Reserve_Data  True

# Output to OpenSearch
[OUTPUT]
    Name            opensearch
    Match           *
    Host            opensearch
    Port            9200
    Index           ecommerce-logs
    Type            _doc
    Logstash_Format On
    Logstash_Prefix ecommerce-logs
    Time_Key        @timestamp
    tls             Off
    Suppress_Type_Name On
    Replace_Dots    On

# Also output to stdout for debugging
[OUTPUT]
    Name            stdout
    Match           *
    Format          json_lines

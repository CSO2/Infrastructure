version: '3.8'

services:
  # --- 1. PostgreSQL (Relational DB) ---
  postgres:
    image: postgres:15
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: cso2
      POSTGRES_PASSWORD: password123
      # Removed POSTGRES_DB to allow manual DB creation if needed
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # --- 2. MongoDB (NoSQL DB) ---
  mongo:
    image: mongo:6.0
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # --- 3. Redis (Cache) ---
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"

  # --- 4. RabbitMQ (Message Queue) ---
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  # --- 5. HashiCorp Vault (Security) ---
  vault:
    image: hashicorp/vault:1.15
    container_name: vault
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: my-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200

  # --- 6. Vault CLI (Helper) ---
  cli-vault:
    image: hashicorp/vault:1.15
    container_name: cli-vault
    entrypoint: sh
    tty: true
    depends_on:
      - vault
    environment:
      VAULT_ADDR: http://vault:8200

  # --- 7. OpenSearch (Centralized Logging) ---
  opensearch:
    image: opensearchproject/opensearch:2.11.1
    container_name: opensearch
    environment:
      - cluster.name=ecommerce-logs
      - node.name=opensearch-node-1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9600:9600"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # --- 8. OpenSearch Dashboards (Log Visualization) ---
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.11.1
    container_name: opensearch-dashboards
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    depends_on:
      opensearch:
        condition: service_healthy

  # --- 9. Fluent Bit (Log Shipper) ---
  fluent-bit:
    image: fluent/fluent-bit:2.2
    container_name: fluent-bit
    volumes:
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
    depends_on:
      opensearch:
        condition: service_healthy
    ports:
      - "24224:24224"
      - "24224:24224/udp"

volumes:
  postgres_data:
  mongo_data:
  opensearch_data:
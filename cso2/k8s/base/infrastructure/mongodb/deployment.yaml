apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
        type: backend-infra
    spec:
      initContainers:
      - name: vault-secret-fetcher
        image: hashicorp/vault:1.17
        command:
        - /bin/sh
        - -c
        - |
          set -e
          echo "Fetching MongoDB secrets from Vault..."
          until vault status -address=http://vault:8200 > /dev/null 2>&1; do
            echo "Waiting for Vault..."
            sleep 3
          done
          export VAULT_ADDR=http://vault:8200
          export VAULT_TOKEN=root
          MONGO_USER=$(vault kv get -mount=secret -field=MONGO_INITDB_ROOT_USERNAME cso2/mongodb)
          MONGO_PASS=$(vault kv get -mount=secret -field=MONGO_INITDB_ROOT_PASSWORD cso2/mongodb)
          echo "MONGO_INITDB_ROOT_USERNAME=$MONGO_USER" > /vault/secrets/db.env
          echo "MONGO_INITDB_ROOT_PASSWORD=$MONGO_PASS" >> /vault/secrets/db.env
          echo "Secrets written successfully"
          cat /vault/secrets/db.env
        volumeMounts:
        - name: vault-secrets
          mountPath: /vault/secrets
      containers:
      - name: mongodb
        image: mongo:7.0
        ports:
        - containerPort: 27017
          name: mongodb
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          valueFrom:
            secretKeyRef:
              name: mongodb-secrets
              key: MONGO_INITDB_ROOT_USERNAME
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mongodb-secrets
              key: MONGO_INITDB_ROOT_PASSWORD
        volumeMounts:
        - name: mongodb-data
          mountPath: /data/db
        - name: vault-secrets
          mountPath: /vault/secrets
          readOnly: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: mongodb-data
        persistentVolumeClaim:
          claimName: mongodb-pvc
      - name: vault-secrets
        emptyDir: {}

# AnalysisTemplate for Canary Health Checks
# Used by Argo Rollouts to verify canary health before promoting
# Triggers automatic rollback on failure
#
# Supported health-path values:
#   - /actuator/health          : Standard Spring Boot health (checks all dependencies)
#   - /actuator/health/liveness : Liveness probe (no external dependency checks)
#   - /health                   : Python/FastAPI services
#   - /                         : Frontend (Next.js)
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: canary-health-check
spec:
  args:
    - name: service-name
    - name: service-port
    - name: health-path
      value: "/actuator/health"  # Default for Spring Boot services
    - name: namespace
  metrics:
    - name: health-check
      # Run health check every 30 seconds
      interval: 30s
      # Run 5 times total during analysis
      count: 5
      # Success if health endpoint returns 200
      successCondition: result[0] == "healthy"
      # Fail rollout after 2 consecutive failures
      failureLimit: 2
      provider:
        job:
          spec:
            backoffLimit: 1
            template:
              spec:
                containers:
                  - name: health-check
                    image: curlimages/curl:8.5.0
                    command:
                      - sh
                      - -c
                      - |
                        # Check canary service health endpoint
                        response=$(curl -s -o /dev/null -w "%{http_code}" \
                          "http://{{args.service-name}}-canary.{{args.namespace}}.svc.cluster.local:{{args.service-port}}{{args.health-path}}" \
                          --connect-timeout 5 --max-time 10)
                        
                        if [ "$response" = "200" ]; then
                          echo "healthy"
                        else
                          echo "unhealthy - got status $response"
                          exit 1
                        fi
                restartPolicy: Never
---
# AnalysisTemplate for HTTP success rate monitoring
# Alternative analysis using Prometheus metrics (requires Prometheus)
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate-check
spec:
  args:
    - name: service-name
    - name: namespace
  metrics:
    - name: success-rate
      interval: 1m
      count: 3
      # Require at least 95% success rate
      successCondition: result[0] >= 0.95
      failureLimit: 1
      provider:
        prometheus:
          address: http://prometheus.monitoring.svc.cluster.local:9090
          query: |
            sum(rate(
              istio_requests_total{
                destination_service_name="{{args.service-name}}-canary",
                destination_service_namespace="{{args.namespace}}",
                response_code!~"5.*"
              }[2m]
            )) /
            sum(rate(
              istio_requests_total{
                destination_service_name="{{args.service-name}}-canary",
                destination_service_namespace="{{args.namespace}}"
              }[2m]
            ))
---
# AnalysisTemplate for latency monitoring (requires Prometheus)
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: latency-check
spec:
  args:
    - name: service-name
    - name: namespace
    - name: threshold-ms
      value: "500"
  metrics:
    - name: p99-latency
      interval: 1m
      count: 3
      # P99 latency must be under threshold
      successCondition: result[0] < {{args.threshold-ms}}
      failureLimit: 1
      provider:
        prometheus:
          address: http://prometheus.monitoring.svc.cluster.local:9090
          query: |
            histogram_quantile(0.99,
              sum(rate(
                istio_request_duration_milliseconds_bucket{
                  destination_service_name="{{args.service-name}}-canary",
                  destination_service_namespace="{{args.namespace}}"
                }[2m]
              )) by (le)
            )

apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata:
  name: jwt-auth
  namespace: istio-ingress
spec:
  selector:
    matchLabels:
      istio: ingress
  jwtRules:
  - issuer: "cso2-auth"
    audiences:
    - "cso2-api"
    # Live JWKS served by user-identity-service (kid: cso2-jwt-key, RS256).
    # Rotating the service keypair automatically updates the verification keys.
    jwksUri: http://user-identity-service.cso2-dev.svc.cluster.local:8081/.well-known/jwks.json
    forwardOriginalToken: true
    outputClaimToHeaders:
    - header: "x-user-subject"
      claim: "sub"
    - header: "x-user-id"
      claim: "sub"
    - header: "x-user-roles"
      claim: "role"

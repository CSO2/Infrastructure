apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        type: backend-service
    spec:
      serviceAccountName: api-gateway-sa
      containers:
      - name: api-gateway
        image: cso2/api-gateway:latest
        ports:
        - containerPort: 8080
        env:
        # Service URLs for internal routing
        - name: AUTH_SERVICE_URL
          value: "http://user-identity-service:8081"
        - name: PRODUCT_CATALOGUE_SERVICE_URL
          value: "http://product-catalogue-service:8082"
        - name: ORDER_SERVICE_URL
          value: "http://order-service:8083"
        - name: SHOPPING_CART_SERVICE_URL
          value: "http://shoppingcart-wishlist-service:8084"
        - name: SUPPORT_SERVICE_URL
          value: "http://support-service:8085"
        - name: CONTENT_SERVICE_URL
          value: "http://content-service:8086"
        - name: NOTIFICATIONS_SERVICE_URL
          value: "http://notifications-service:8087"
        - name: REPORTING_SERVICE_URL
          value: "http://reporting-and-analysis-service:8088"
        - name: AI_SERVICE_URL
          value: "http://ai-service:8089"
        # JWT Secret for token validation
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: api-gateway-secrets
              key: JWT_SECRET
        # CORS origins
        - name: FRONTEND_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: api-gateway-config
              key: FRONTEND_ORIGINS
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5

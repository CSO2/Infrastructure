# Argo Rollout for frontend
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: frontend
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: frontend
  strategy:
    canary:
      canaryService: frontend-canary
      stableService: frontend
      trafficRouting:
        istio:
          virtualServices:
            - name: cso2-api
              routes:
                - primary
      steps:
        - setWeight: 10
        - pause: { duration: 1m }
        - setWeight: 25
        - pause: { duration: 1m }
        - setWeight: 50
        - pause: { duration: 2m }
        - setWeight: 100
      # Frontend uses root path health check
      analysis:
        templates:
          - templateName: canary-health-check
        startingStep: 1
        args:
          - name: service-name
            value: frontend
          - name: service-port
            value: "3000"
          - name: health-path
            value: "/"
          - name: namespace
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
  template:
    metadata:
      labels:
        app: frontend
        type: frontend
    spec:
      serviceAccountName: frontend-sa
      containers:
        - name: frontend
          image: cso2/frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://user-identity-service:8081"
            - name: NEXT_PUBLIC_PRODUCT_SERVICE_URL
              value: "http://product-catalogue-service:8082"
            - name: NEXT_PUBLIC_ORDER_SERVICE_URL
              value: "http://order-service:8083"
            - name: NEXT_PUBLIC_CART_SERVICE_URL
              value: "http://shoppingcart-wishlist-service:8084"
            - name: NEXT_PUBLIC_SUPPORT_SERVICE_URL
              value: "http://support-service:8085"
            - name: NEXT_PUBLIC_CONTENT_SERVICE_URL
              value: "http://content-service:8086"
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "400m"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3

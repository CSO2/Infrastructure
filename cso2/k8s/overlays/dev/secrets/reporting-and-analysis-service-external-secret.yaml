apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: reporting-and-analysis-service-secrets
  namespace: cso2-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-dev
    kind: SecretStore
  target:
    name: reporting-and-analysis-service-secrets
    creationPolicy: Owner
  data:
  - secretKey: DATABASE_PASSWORD
    remoteRef:
      key: secret/data/cso2/dev/reporting-and-analysis-service
      property: DATABASE_PASSWORD

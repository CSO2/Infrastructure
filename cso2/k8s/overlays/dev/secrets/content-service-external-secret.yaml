apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: content-service-secrets
  namespace: cso2-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-dev
    kind: SecretStore
  target:
    name: content-service-secrets
    creationPolicy: Owner
  data:
  - secretKey: MONGODB_URI
    remoteRef:
      key: secret/data/cso2/dev/content-service
      property: MONGODB_URI

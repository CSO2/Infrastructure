apiVersion: v1
kind: Service
metadata:
  name: vault
  labels:
    app: vault-external
spec:
  ports:
  - port: 8200
    targetPort: 8200
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: vault
  labels:
    kubernetes.io/service-name: vault
addressType: FQDN
ports:
- port: 8200
  protocol: TCP
endpoints:
- addresses:
  - host.minikube.internal

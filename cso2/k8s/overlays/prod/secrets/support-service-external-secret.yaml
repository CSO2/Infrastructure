apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: support-service-secrets
  namespace: cso2-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-prod
    kind: SecretStore
  target:
    name: support-service-secrets
    creationPolicy: Owner
  data:
  - secretKey: DATABASE_PASSWORD
    remoteRef:
      key: secret/data/cso2/prod/support-service
      property: DATABASE_PASSWORD
  - secretKey: MONGODB_URI
    remoteRef:
      key: secret/data/cso2/prod/support-service
      property: MONGODB_URI
  - secretKey: ORDER_SERVICE_URL
    remoteRef:
      key: secret/data/cso2/prod/support-service
      property: ORDER_SERVICE_URL

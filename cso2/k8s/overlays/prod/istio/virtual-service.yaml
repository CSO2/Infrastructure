# Production VirtualService - Routes all API traffic through api-gateway
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: cso2-api
  namespace: cso2-prod
spec:
  hosts:
  - "cso2.randitha.net"
  - "api.cso2.randitha.net"
  gateways:
  - istio-ingress/cso2-gateway
  http:
  # All API traffic goes through api-gateway
  - match:
    - headers:
        ":authority":
          exact: "api.cso2.randitha.net"
      uri:
        prefix: /api/
    route:
    - destination:
        host: api-gateway.cso2-prod.svc.cluster.local
        port:
          number: 8080
    corsPolicy:
      allowOrigins:
      - exact: "https://cso2.randitha.net"
      allowMethods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
      allowHeaders:
      - "*"
      allowCredentials: true
      maxAge: "24h"

  # Health check endpoint for api-gateway
  - match:
    - headers:
        ":authority":
          exact: "api.cso2.randitha.net"
      uri:
        exact: /healthz
    route:
    - destination:
        host: api-gateway.cso2-prod.svc.cluster.local
        port:
          number: 8080

  # Frontend route - cso2.randitha.net
  - match:
    - headers:
        ":authority":
          exact: "cso2.randitha.net"
      uri:
        prefix: /
    route:
    - destination:
        host: frontend.cso2-prod.svc.cluster.local
        port:
          number: 3000
    corsPolicy:
      allowOrigins:
      - exact: "https://cso2.randitha.net"
      allowMethods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
      allowHeaders:
      - "*"
      allowCredentials: true
      maxAge: "24h"
